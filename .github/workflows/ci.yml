name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build -trimpath -o bin/tfai ./cmd/tfai

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race -count=1 ./...

      # Binary smoke tests - verify the built binary actually runs
      - name: Smoke test - version
        run: ./bin/tfai version

      - name: Smoke test - help
        run: ./bin/tfai --help

      - name: Smoke test - serve help
        run: ./bin/tfai serve --help

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Symbol scan: hard fail — our code calls a vulnerable function
      - name: govulncheck (symbol — must pass)
        run: govulncheck -scan symbol ./...

      # Package scan: advisory — log transitive dep vulns, don't block
      # Known suppressions tracked in .known-vulns.txt
      - name: govulncheck (package — advisory)
        run: |
          if ! govulncheck -scan package ./... 2>&1; then
            echo ""
            echo "⚠ Package-level vulnerabilities detected (see above)."
            echo "Known suppressions tracked in .known-vulns.txt:"
            cat .known-vulns.txt | grep -v '^#' | grep -v '^$' || true
            echo ""
            echo "If these are NEW vulns not in .known-vulns.txt, investigate before merging."
          fi
